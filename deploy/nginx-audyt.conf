# Vhost panelu audytu. Kopiować do /etc/nginx/sites-available/audyt, potem
# dowiązać w sites-enabled i przeładować nginx PO `nginx -t`.
#
# ## Ścieżka żądania
#
#   przeglądarka --HTTPS--> Cloudflare --> Cytrus (backend.strony.me)
#                --HTTP--> ten nginx (port przekierowany) --> 127.0.0.1:8000
#
# Trzy warstwy, każda konfigurowana osobno i każda psująca się inaczej:
#
#   1. rekord DNS  — panel OVH (strefa cxlabs.digital), CNAME na backend.strony.me
#   2. podpięcie hosta u operatora Mikrusa — TO ONO wydaje certyfikat dla tej
#      KONKRETNEJ nazwy. Brak podpięcia = zerwane TLS, nie 404
#   3. ten plik
#
# Zmierzone 2026-09-02: certyfikat `CN=audyt.cxlabs.digital` wystawiony przez
# Google Trust Services, po podpięciu hosta u operatora. Na originie nie ma
# i nie będzie żadnego certyfikatu — ACME na Mikrusie nie przejdzie (D18).
#
# ## Zanim skopiujesz
#
# `NNNNN` niżej to port przekierowany, przydzielany per kontener. Podejrzyj go
# w innych vhostach na maszynie (`grep listen /etc/nginx/sites-enabled/*`)
# — świadomie nie ma go w tym repo, bo repo jest publiczne.

server {
    listen 80;
    listen [::]:80;
    listen NNNNN;
    listen [::]:NNNNN;
    server_name audyt.cxlabs.digital;

    # BEZ `default_server` — na tej maszynie ten wpis ma już vhost `docs`,
    # a zdublowanie wywala całego nginksa, razem z sześcioma cudzymi adresami.
    #
    # Pisownia jest polska. Przez kilka godzin 2026-09-02 panel stał pod
    # `audit` (angielska), bo ten rekord powstał pierwszy — stąd obie pisownie
    # w historii repo. Jeden panel z danymi osobowymi pod dwoma adresami to dwa
    # miejsca do pilnowania, więc nazwa jest jedna.

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Do originu przychodzi HTTP; klient jechał po HTTPS przez Cloudflare.
        # Bez tego aplikacja widzi `http` i nie ma jak się dowiedzieć inaczej.
        proxy_set_header X-Forwarded-Proto https;

        # Domyślne 60 s nginxa jest tu za mało. Podgląd przed audytem woła
        # monday synchronicznie, a `MondayClient` ma własny limit 60 s plus
        # ponawianie z odczekaniem i pauzę na okno complexity — czyli jedno
        # żądanie potrafi legalnie przekroczyć minutę. Klient dostałby wtedy
        # 504 PO tym, jak jego budżet wywołań monday został już wydany.
        #
        # Sam audyt tego nie potrzebuje (żyje w wątku, panel odpytuje o postęp),
        # więc limit jest dla ścieżek synchronicznych.
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
    }

    # Panel niesie imiona, nazwiska i e-maile pracowników klienta (O23).
    # Nie ma go w wyszukiwarkach — i to jest zabezpieczenie przed przypadkiem,
    # nie przed kimś, kto zna adres. Na to jest hasło i sesja (D16).
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
}
