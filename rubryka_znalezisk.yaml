# Rubryka znalezisk — audyt konta monday.com
# CXLABS | wersja 0.1 | 2026-07-29
#
# Ten plik jest JEDNOCZEŚNIE:
#   - specyfikacją wymagań (etap 1)
#   - skillem dla agenta analitycznego (etap 3)
#   - podstawą evali na zamrożonych snapshotach (etap 4)
#
# Zasada nadrzędna: każde znalezisko musi wskazywać na fakt deterministyczny
# ze snapshotu (pole `dowod`). Znalezisko bez dowodu odpada na walidacji
# i nie dochodzi do renderera.
#
# ──────────────────────────────────────────────────────────────
# 0.2 — 2026-08-01, przed 3.9. Sygnały dociągnięte do POMIARÓW
# ──────────────────────────────────────────────────────────────
#
# Wersja 0.1 powstała przed zbudowaniem collectora, więc pięć klas opisywało
# pola, których API nie oddaje, albo których zbierać nie wolno. Detektor
# wzbudzałby wtedy hipotezy niemożliwe do domknięcia, bo finding bez `dowod`
# odpada na walidacji — czyli klasa wyglądałaby na zaimplementowaną
# i nie dawała ani jednego znaleziska.
#
# Zmienione, każde z odnośnikiem do pomiaru w `docs/OTWARTE.md`:
#
#   ZOMBIE_ACCOUNT     `enabled`/`is_pending` → `kind` + `status`        (O17)
#   PLAN_MISMATCH      `max_users` bywa null → drugie źródło mianownika  (O2)
#   BOARD_GHOST        `updated_at` → `najnowszy_at`; `type = board`     (O18, O14)
#                      `rozklad_statusow` usunięty — łamał D5
#   AUTOMATION_ABSENT  liczba automatyzacji → udział tablic bez zdarzeń  (O1, O12)
#   AUTOMATION_DEAD    `is_active`/0 uruchomień → błędy i wyczerpania    (O1, O12)
#
# Czego NIE zmieniono: wag, wysiłków naprawy, budżetów i kolejności raportu.
# To są decyzje biznesowe z etapu 1 i pomiary techniczne nie mają do nich nic
# do powiedzenia.

wersja: "0.4"
odbiorca_domyslny: wewnetrzny

# ──────────────────────────────────────────────────────────────
# SŁOWNIKI
# ──────────────────────────────────────────────────────────────

slowniki:
  waga: [krytyczna, wysoka, srednia, niska]

  wysilek_naprawy: [niski, sredni, wysoki]
  # niski   — zmiana ustawień, do godziny, bez migracji danych
  # sredni  — przebudowa jednej tablicy lub procesu, do dnia
  # wysoki  — migracja danych, zmiana nawyków zespołu, projekt

  typ_wyceny: [oszczednosc_bezposrednia, ryzyko]
  # oszczednosc_bezposrednia — kwota z mnożenia znanych liczb
  # ryzyko                   — bez kwoty, świadomie
  #
  # UWAGA: nie ma typu `czas_odzyskany`. Wymagałby danych na poziomie
  # itemów, których nie zbieramy (objętość + PII). Wymyślone stałe
  # godzinowe zabijają wiarygodność raportu u pierwszego klienta,
  # który je sprawdzi.

  widocznosc: [klient, tylko_wewnetrzne]

# ──────────────────────────────────────────────────────────────
# REGUŁY GLOBALNE
# ──────────────────────────────────────────────────────────────

reguly:
  kolejnosc_raportu:
    # Zastępuje Health Score. Bez wag arbitralnych — sortowanie, nie średnia.
    - waga malejąco
    - wysilek_naprawy rosnąco
    # Efekt: krytyczne + niski wysiłek na górze = quick wins na pierwszy slajd

  bezpiecznik_globalny:
    max_wywolan_na_run: 600
    # Nie polityka, a wyłącznik awaryjny. Przekroczenie = błąd w logice,
    # nie duże konto. Loguj i przerwij.

  wersjonowanie:
    # Każdy finding w bazie zapisuje `rubric_version`. Umożliwia
    # przepuszczenie starego snapshotu przez nową rubrykę i porównanie.
    zapisuj_wersje: true

# ──────────────────────────────────────────────────────────────
# KLASY ZNALEZISK
# ──────────────────────────────────────────────────────────────

klasy:

  # ═══ LICENCJE I PLAN ═══════════════════════════════════════

  - id: ZOMBIE_ACCOUNT
    nazwa: Konto nieaktywne, wciąż licencjonowane
    modul_zrodlowy: 2
    # Sygnał przepisany w 0.2 pod pomiar (OTWARTE.md O17). Pól `enabled`
    # i `is_pending` nie ma w API 2026-10, a `kind` niesie więcej: rozdziela
    # konta agentów AI i podglądowe od ludzi zajmujących płatne miejsca.
    # Bez tego rozdzielenia sygnał zapalałby się na 95 rekordach zamiast 19.
    sygnal: |
      kind IN (admin, member) AND status = ACTIVE
      AND (last_activity > 90 dni
           OR (last_activity = null AND autor nieobecny w activity logach okna))
    rola_agenta: brak
    budzet_wywolan: 0
    warunki_odrzucenia:
      - kind = personal_agent_member — konto agenta AI, nie człowiek
      - kind IN (guest, view_only) — nie zajmuje płatnego miejsca, patrz GUEST_SPRAWL
      - status = PENDING — to należy do NEVER_ACTIVATED, nie tutaj
      - became_active_at nowsze niż 90 dni — konto świeże, nie martwe
    waga: wysoka
    wysilek_naprawy: niski
    typ_wyceny: oszczednosc_bezposrednia
    wzor: liczba_kont * koszt_licencji_mies * 12
    zmienne_od_klienta: [koszt_licencji_mies]
    # `last_activity` jest puste u 37 z 95 osób i null znaczy „nie wiem", nie
    # „martwy" — dlatego dowodem jest też brak autora w logach (3.7).
    dowod: [user_hash, kind, status, last_activity, obecnosc_w_logach, plan_tier]
    widocznosc: klient
    trop_sprzedazowy: porządkowanie licencji — szybka wygrana budująca zaufanie

  - id: PLAN_MISMATCH
    nazwa: Plan nieadekwatny do realnego użycia
    modul_zrodlowy: 1
    # `max_users` pochodzi z `account.plan`, a to zwraca NULL przy tokenie bez
    # uprawnień admina (zmierzone na CXLABS, O2). Dlatego 0.2 dopuszcza drugie
    # źródło mianownika: `active_members_count` z konta. To nie to samo — liczba
    # miejsc KUPIONYCH kontra liczba miejsc ZAJĘTYCH — więc detektor musi
    # zapisać, którego użył, a agent nie może mieszać jednego z drugim.
    sygnal: |
      max_users znane:    (max_users - aktywni_30d) / max_users > 0.3
      max_users nieznane: (active_members_count - aktywni_30d)
                          / active_members_count > 0.3
    rola_agenta: |
      Ustal, czy nadwyżka miejsc jest zaplanowanym zapasem na rekrutację,
      czy pozostałością. Sprawdź daty utworzenia kont — jeśli nikt nowy
      nie doszedł od pół roku, to nie zapas, to nadpłata.
      Jeśli podstawą był `active_members_count`, powiedz w findingu wprost,
      że mówisz o miejscach ZAJĘTYCH, bo liczby kupionych nie dostaliśmy.
    budzet_wywolan: 3
    warunki_odrzucenia:
      - konta utworzone w ostatnich 60 dniach — konto rośnie
      - tier wymuszony jedną funkcją, której faktycznie używają
      - brak i max_users, i active_members_count — nie ma mianownika, nie zgaduj
    waga: wysoka
    wysilek_naprawy: niski
    typ_wyceny: oszczednosc_bezposrednia
    wzor: nadwyzka_miejsc * koszt_licencji_mies * 12
    zmienne_od_klienta: [koszt_licencji_mies]
    dowod: [plan_tier, podstawa_miejsc, liczba_miejsc, aktywni_30d, daty_utworzenia_kont]
    widocznosc: klient
    trop_sprzedazowy: przegląd licencji — argument, że audyt zwrócił się od razu

  - id: GUEST_SPRAWL
    nazwa: Niekontrolowany dostęp gości
    modul_zrodlowy: 2
    sygnal: |
      liczba_guest > 0.25 * liczba_members
      OR istnieją goście z last_activity > 180 dni
    rola_agenta: |
      Ustal, do których tablic mają dostęp nieaktywni goście.
      Podnieś wagę do krytycznej, jeśli którakolwiek zawiera dane
      wskazujące na wrażliwość (kadry, finanse, wynagrodzenia, prawne)
      — oceniaj po nazwie tablicy i kolumn.
    budzet_wywolan: 5
    warunki_odrzucenia:
      - model współpracy oparty na gościach (agencja, kancelaria) — wtedy
        raportuj tylko nieaktywnych, nie samą liczbę
    waga: srednia
    wysilek_naprawy: niski
    typ_wyceny: ryzyko
    wzor: null
    dowod: [liczba_guest, liczba_members, "guest_hash[]", "tablice_dostepne[]"]
    widocznosc: klient
    trop_sprzedazowy: uporządkowanie uprawnień i governance

  # ═══ ZAANGAŻOWANIE ═════════════════════════════════════════

  # ── UZYTKOWNIK_WYGASZONY ───────────────────────────────────────────────
  #
  # Klasa dodana 2026-08-17 (etap 4). Powstała, bo między ZOMBIE_ACCOUNT
  # a ENGAGEMENT_DROP była dziura, w którą wpadały osoby faktycznie widoczne
  # w logach:
  #
  #   * ZOMBIE_ACCOUNT ich NIE WIDZI — jego detektor ma `autorzy.user_hash IS NULL`,
  #     czyli bierze wyłącznie osoby NIEOBECNE w logach. Przecięcie zbiorów jest
  #     puste z konstrukcji (zmierzone: 8 osób w logach, 7 kont zombie, 0 wspólnych).
  #   * ENGAGEMENT_DROP mierzy GRUPY (zespół, workspace), nie osoby, i na snapshocie
  #     #7 wzbudza zero hipotez — żaden zespół nie spełnia obu progów naraz.
  #
  # Różnica wobec ZOMBIE_ACCOUNT jest jakościowa, nie ilościowa: tam konto MILCZY
  # (nie wiadomo, co robiło), tutaj wiadomo DOKŁADNIE, na czym pracowało, na ilu
  # tablicach i w którym przedziale czasu — bo to jest w `aktywnosc.per_uzytkownik`.
  # Dlatego finding może odpowiedzieć na „co, gdzie, kiedy przestał", a nie tylko
  # „ile dni ciszy".
  - id: UZYTKOWNIK_WYGASZONY
    nazwa: Osoba przestała pracować, choć konto zostało
    modul_zrodlowy: 2
    sygnal: |
      osoba obecna w activity logs, której akcje leżą WYŁĄCZNIE
      w kubełkach 31-60 i 61-90 dni (albo świeże to <15% starych),
      przy co najmniej 5 akcjach łącznie — pracowała i przestała
    rola_agenta: |
      Ustal, CO robiła i czy praca przeszła gdzie indziej.
      `boardy[]` mówi na których tablicach, `po_event` co dokładnie
      (tworzenie itemów to inna praca niż porządkowanie kolumn),
      `kubelki_dni` w którym przedziale. Sprawdź, czy te same tablice
      żyją dalej z innym autorem — jeśli tak, to przekazanie obowiązków,
      nie porzucenie procesu, i wtedy odrzuć.
    budzet_wywolan: 6
    warunki_odrzucenia:
      # Konta agentów AI to nie ludzie. ZMIERZONE na snapshocie #7: 3 z 8 osób
      # w logach to `personal_agent_member` — bez tego warunku klasa zgłaszałaby
      # „agent Quotation przestał pracować", co jest bez sensu.
      - kind = personal_agent_member — konto agenta AI, nie człowiek
      # Autor w logach nieobecny na liście kont: konto usunięte albo gość spoza
      # zakresu. ZMIERZONE: 2 z 8 (w tym najaktywniejsza osoba, 205 akcji).
      - autor nieobecny w `uzytkownicy` — konto usunięte, nie ma o kim orzekać
      - praca przeszła na inną osobę na tych samych tablicach — przekazanie obowiązków
      - okres nieobecności pokrywa się z urlopem albo zamknięciem projektu
    waga: srednia
    wysilek_naprawy: niski
    typ_wyceny: ryzyko
    wzor: null
    dowod: [user_hash, kubelki_dni, "boardy[]", po_event, akcji, tablic]
    # Mówi o KONKRETNEJ osobie, więc nie do raportu klienta bez rozmowy —
    # ta sama granica co ENGAGEMENT_DROP.
    widocznosc: tylko_wewnetrzne
    trop_sprzedazowy: |
      przegląd przypisań i przekazania obowiązków. Wewnętrzne, bo
      "ta osoba przestała pracować" wymaga rozmowy, nie akapitu w PDF.

  - id: ENGAGEMENT_DROP
    nazwa: Spadek zaangażowania zespołu lub działu
    modul_zrodlowy: 2, 5
    sygnal: |
      grupa (zespół lub workspace) z udziałem aktywnych_7d < 40%
      przy jednoczesnym udziale aktywnych_90d > 70%
      — czyli używali, przestali
    rola_agenta: |
      To nie jest znalezisko liczbowe, tylko pytanie "dlaczego".
      Ustal moment spadku z activity logs. Sprawdź, co się wtedy
      stało: nowa tablica, zmiana struktury, odejście właściciela,
      nowa automatyzacja generująca szum. Bez przyczyny to znalezisko
      jest bezużyteczne — odrzuć, jeśli nie znajdziesz hipotezy.
    budzet_wywolan: 10
    warunki_odrzucenia:
      - sezonowość (urlopy, zamknięcie roku) — sprawdź analogiczny okres
      - grupa projektowa po zakończeniu projektu
      - brak możliwości wskazania przyczyny
    waga: wysoka
    wysilek_naprawy: sredni
    typ_wyceny: ryzyko
    wzor: null
    dowod: [grupa, aktywni_7d, aktywni_90d, data_zwrotu, zdarzenie_towarzyszace]
    widocznosc: tylko_wewnetrzne
    trop_sprzedazowy: |
      warsztat adopcyjny albo przebudowa procesu — zależnie od przyczyny.
      Wewnętrzne, bo "twój dział przestał używać narzędzia, które kupiłeś"
      wymaga rozmowy, nie akapitu w PDF.

  # ═══ STRUKTURA ═════════════════════════════════════════════

  - id: BOARD_GHOST
    nazwa: Tablica porzucona
    modul_zrodlowy: 3
    # Dwie poprawki w 0.2, obie z pomiarów.
    #
    # 1. NIE `updated_at` (O18). Na 105 tablicach log aktywności był nowszy niż
    #    `updated_at` w 94 przypadkach, zgodny w 11, starszy w ZERO, przy
    #    rozbieżności do 40,6 dnia. `updated_at` śledzi metadane tablicy, nie
    #    pracę na itemach, więc sygnał na nim uznawałby za martwe tablice,
    #    na których pracowano trzy tygodnie temu. Rozstrzyga `najnowszy_at`.
    # 2. `type = board` (O14). `boards` zwraca też tablice podelementów
    #    i DOKUMENTY — zmierzone: board 92, document 5, sub_items_board 3.
    #    Tablica podelementów jest służebna, a dokument nie jest tablicą.
    #    Rozpoznanie po nazwie jest błędem: nazwa jest lokalizowana.
    sygnal: |
      type = board AND state = active AND items_count > 0
      AND (najnowszy_at > 90 dni OR brak wpisów w logu okna)
    rola_agenta: |
      Rozstrzygnij: archiwum czy porzucony proces. Nie masz statusów itemów
      (D5 — `items_count` to granica), więc oprzyj się na kształcie aktywności:
      `po_klasie` mówi, czy ostatnia praca była operacyjna (ktoś wypełniał)
      czy tylko strukturalna (ktoś porządkował), a `udzial_najaktywniejszego`
      i `kubelki_dni` — czy proces gasł stopniowo, czy ucichł nagle.
      Nagłe ucichnięcie jednej osoby to inna historia niż wygaszanie zespołem.
    budzet_wywolan: 4
    warunki_odrzucenia:
      # DOPRECYZOWANE 2026-08-19 (O34). Poprzednie brzmienie: „tablica-szablon
      # lub referencyjna (rozpoznaj po nazwie)" — jedyny warunek w całej rubryce
      # oparty na OSĄDZIE, nie na danych.
      #
      # ZMIERZONE na dwóch pełnych runach tego samego snapshotu: 11 z 30 hipotez
      # BOARD_GHOST rozstrzygnięto RÓŻNIE, i wszystkie odrzucenia powoływały się
      # na nazwę WORKSPACE'U („CRM_PL_Demo"), a nie tablicy. Warunek nie mówił,
      # czyja nazwa się liczy, więc agent decydował sesja po sesji. Powtarzalność
      # 0,797 wobec progu ≥0,8 — jedyny niespełniony próg etapu 4.
      #
      # Teraz dwa OSOBNE warunki, oba z wypisanymi słowami. Lista jest zamknięta:
      # „rozpoznaj po nazwie" bez listy to zaproszenie do zgadywania.
      - >-
        nazwa TABLICY zawiera słowo wskazujące na wzorzec, nie na proces:
        szablon, template, wzór, wzorzec, przykład, sample, demo, test,
        sandbox, kopia, copy, backup, archiwum, archive
      # Nazwa workspace'u to SŁABSZY sygnał niż nazwa tablicy: klient może trzymać
      # produkcję w workspace nazwanym „Demo" po nieudanym pilocie. Dlatego wymaga
      # DRUGIEGO sygnału — tak samo jak przy DUPLICATE_STRUCTURE po O33.
      - >-
        nazwa WORKSPACE'U wskazuje na środowisko nieprodukcyjne (demo, test,
        sandbox, szkolenie, training, POC, pilot) ORAZ `updated_at` różni się od
        `created_at` o mniej niż dobę — czyli tablicę utworzono i nigdy nie
        ruszono. Sama nazwa workspace'u NIE wystarcza: produkcja po nieudanym
        pilocie też bywa w workspace „Demo", a wtedy `updated_at` jest późniejszy
      - type != board — podelementy i dokumenty nie są kandydatami
      - nazwa wskazuje na zamknięty rok lub okres
      - created_at nowsze niż 90 dni — tablica świeża, nie porzucona
    waga: srednia
    wysilek_naprawy: niski
    typ_wyceny: ryzyko
    wzor: null
    # ŚWIADOMIE BEZ `rozklad_statusow` — wymagałby zejścia na poziom itemów,
    # czego zabrania D5. Zastąpione kształtem aktywności z 3.7, który mamy.
    dowod: [board_id, nazwa, typ, najnowszy_at, items_count, po_klasie, kubelki_dni]
    widocznosc: klient
    trop_sprzedazowy: porządkowanie workspace — wejście do szerszej przebudowy

  - id: BOARD_NO_OWNER
    nazwa: Tablica bez właściciela
    modul_zrodlowy: 3
    sygnal: owners = [] OR wszyscy właściciele mają enabled = false
    rola_agenta: |
      Ustal, czy tablica jest żywa. Bez właściciela + aktywna = pilne,
      bo nikt nie odpowiada za coś, z czego korzysta zespół.
      Zaproponuj właściciela na podstawie tego, kto najczęściej
      wprowadza zmiany.
    budzet_wywolan: 4
    warunki_odrzucenia: []
    waga: wysoka
    wysilek_naprawy: niski
    typ_wyceny: ryzyko
    wzor: null
    dowod: [board_id, owners, updated_at, top_kontrybutor_hash]
    widocznosc: klient
    trop_sprzedazowy: governance i model odpowiedzialności

  - id: BOARD_OVERCOMPLEX
    nazwa: Tablica z polami, których nikt nie wypełnia
    modul_zrodlowy: 3
    sygnal: liczba_kolumn > 15
    rola_agenta: |
      Ustal, które kolumny są faktycznie martwe. UWAGA: snapshot nie
      zawiera wskaźnika wypełnienia (nie schodzimy na poziom itemów),
      więc musisz to sprawdzić przez narzędzie na wybranej próbce.
      Odróżnij martwe od wypełnianych rzadko celowo (eskalacja, wyjątki).
    budzet_wywolan: 8
    warunki_odrzucenia:
      - tablica archiwalna lub raportowa (kolumny formuł, lustra)
      - kolumny wypełniane automatycznie przez integracje
    waga: srednia
    wysilek_naprawy: sredni
    typ_wyceny: ryzyko
    wzor: null
    dowod: [board_id, liczba_kolumn, "kolumny_martwe[]", rozmiar_probki]
    widocznosc: klient
    trop_sprzedazowy: upraszczanie procesu — częsty i wdzięczny temat

  - id: DUPLICATE_STRUCTURE
    nazwa: Wiele tablic robiących to samo
    modul_zrodlowy: 3
    sygnal: |
      >= 2 tablice w tym samym workspace o nakładaniu zestawu
      typów i nazw kolumn >= 70%
    rola_agenta: |
      Odróżnij podział celowy od rozjazdu. Celowy: podział po kliencie,
      regionie, roku — wtedy nazwy tworzą serię i wszystkie są aktywne.
      Rozjazd: te same kolumny, ci sami subskrybenci, jedna aktywna
      a reszta cichnie. Sprawdź daty utworzenia — jeśli powstawały
      sukcesywnie, to prawdopodobnie każdy zakłada własną kopię,
      bo nikt nie wie o istniejącej.
    budzet_wywolan: 10
    warunki_odrzucenia:
      - nazwy tworzą jawną serię (rok, klient, region) i wszystkie aktywne
      - tablice w różnych workspace'ach należących do różnych zespołów
      # ZMIERZONE 2026-08-17 (O33): agent przy wysokim wysiłku sam to rozpoznaje
      # („workspace nazywa się CRM_PL_Demo, co wskazuje na materiał demo/szablonowy,
      # nie produkcyjny rozjazd"), ale kosztowało to 0,77 USD na 6 hipotez.
      # Warunek jawny jest tańszy niż to samo rozumowanie w każdej sesji.
      #
      # UWAGA na granicę: nazwa workspace to HEURYSTYKA. Klient może trzymać
      # produkcję w workspace nazwanym „Demo" po nieudanym pilocie — dlatego
      # warunek wymaga DRUGIEGO sygnału (obie strony pary martwe), nie samej nazwy.
      - >-
        workspace nazwany jako demo, sandbox, test albo szkolenie ORAZ obie
        tablice pary bez aktywności w oknie — wtedy to szablon rozstawiony raz,
        nie rozjazd procesu. Sama nazwa nie wystarcza: produkcja po nieudanym
        pilocie też bywa w workspace „Demo"
      # Bez tego warunku klasa mówi „duplikat" o parze, która nigdy nie żyła —
      # a rubryka opisuje rozjazd jako „jedna aktywna, reszta cichnie".
      - obie tablice pary mają zero wpisów w logu od chwili utworzenia
    waga: wysoka
    wysilek_naprawy: wysoki
    typ_wyceny: ryzyko
    wzor: null
    # `aktywnosc_stron` dodane 2026-08-17: agent przy `effort=medium` gubił ten
    # fakt w 3 z 6 findingów, bo NIKT go nie wymagał. Fakt rozstrzyga klasę
    # (rozjazd czy martwy szablon), więc musi być w dowodzie, nie w dobrej woli.
    dowod:
      ["board_ids[]", nakladanie_kolumn, nakladanie_subskrybentow, daty_utworzenia,
       aktywnosc_stron]
    widocznosc: klient
    trop_sprzedazowy: konsolidacja i przebudowa — projekt, nie poprawka

  - id: PROCESS_BYPASS
    nazwa: Zespół obchodzi proces
    modul_zrodlowy: 3, 5
    sygnal: |
      brak sygnału pojedynczego — wzbudzane koniunkcją:
      tablica ucichła (> 60 dni) AND w oknie ±30 dni od zamilknięcia
      powstały >= 2 nowe tablice w tym samym workspace
      o nakładaniu kolumn >= 50%
    rola_agenta: |
      ZNALEZISKO FLAGOWE — tu jesteś najbardziej potrzebny.
      Porównaj kolumny starej i nowych tablic. Sprawdź, czy subskrybenci
      się pokrywają (jeśli tak, to ci sami ludzie, nowe miejsce = obejście,
      nie nowy zespół). Ustal, co w starej tablicy było kosztem:
      liczba pól, ścieżka akceptacji, brak właściciela, martwa automatyzacja
      blokująca przepływ. Rekomendacja musi wskazywać przyczynę,
      nie objaw — "uprościć do N pól i zmigrować", nie "używać starej tablicy".
    budzet_wywolan: 12
    warunki_odrzucenia:
      - podział wg klienta/projektu/okresu, a nie obejście
      - rozłączni subskrybenci — to nowy zespół, nie ucieczka
      - stara tablica zarchiwizowana świadomie (state != active)
    waga: krytyczna
    wysilek_naprawy: wysoki
    typ_wyceny: ryzyko
    wzor: null
    dowod:
      - board_stary
      - boardy_nowe[]
      - nakladanie_kolumn
      - nakladanie_subskrybentow
      - data_zamilkniecia
      - daty_utworzenia_nowych
      - hipoteza_przyczyny
    widocznosc: tylko_wewnetrzne
    trop_sprzedazowy: |
      discovery i przebudowa procesu — najwyższa wartość kontraktowa.
      Wewnętrzne, bo to znaczy "twoi ludzie omijają system, który kupiłeś",
      a osoba czytająca raport zwykle sama to konto zbudowała.
      Do rozmowy, nie do PDF-a.

  # ═══ AUTOMATYZACJE ═════════════════════════════════════════

  - id: AUTOMATION_ABSENT
    nazwa: Konto nie korzysta z automatyzacji
    modul_zrodlowy: 4
    # Przepisane w 0.2, bo poprzedni sygnał był NIEWYKONALNY (O1, O12).
    # API monday **nie udostępnia listy automatyzacji** — ani per konto, ani per
    # tablica. Nie ma więc `liczba_automatyzacji`, a bez licznika nie ma
    # gęstości. Dostępne jest tylko to, co zmierzone:
    #   - `account_trigger_statistics` — liczby uruchomień na POZIOMIE KONTA
    #   - `trigger_events(filters: {boardId})` — zdarzenia per tablica
    # Sygnał przenosi się więc z „ile automatyzacji istnieje" na „ile tablic
    # nie widziało ANI JEDNEGO zdarzenia automatyzacji w oknie". To odpowiada
    # na to samo pytanie biznesowe („robią ręcznie to, co mogłoby chodzić samo"),
    # tylko liczy skutki zamiast konfiguracji.
    sygnal: |
      uruchomienia_konta = 0
      OR udzial_tablic_bez_zdarzen_automatyzacji > 0.8
    rola_agenta: |
      Wskaż 3 najlepsze kandydatury na automatyzację. Szukaj tablic
      z kolumną statusu, właścicielem i datą — to gotowy wzorzec
      "zmiana statusu → powiadom właściciela → ustaw termin".
      Uzasadnij wyborem tablicy, nie ogólnikiem.
      NIE twierdź, ile automatyzacji klient ma — tej liczby nie mamy z API.
      Mów o tablicach bez śladu automatyzacji, bo to jest to, co zmierzyliśmy.
    budzet_wywolan: 8
    warunki_odrzucenia:
      - konto młodsze niż 60 dni — jeszcze się wdrażają
      - automatyzacja realizowana zewnętrznie (Make, Zapier) — sprawdź,
        czy w nazwach kolumn lub integracjach są tego ślady
      - sondowanie tablic urwane sufitem próbki — udział policzony na wycinku
    waga: wysoka
    wysilek_naprawy: sredni
    typ_wyceny: ryzyko
    wzor: null
    dowod: [uruchomienia_konta, tablic_sondowanych, tablic_bez_zdarzen, udzial, "kandydaci[]"]
    widocznosc: klient
    trop_sprzedazowy: |
      NAJMOCNIEJSZY TROP HANDLOWY. Konto bez automatyzacji to konto,
      które płaci za monday i używa go jak Excela. Warsztat automatyzacji
      z gotową listą trzech kandydatów to oferta, która sama się pisze.

  - id: AUTOMATION_DEAD
    nazwa: Automatyzacja uruchamia się i nie działa
    modul_zrodlowy: 4
    # Przepisane w 0.2. Poprzedni sygnał („is_active = false OR 0 uruchomień")
    # był niewykonalny w obie strony: `is_active` nie istnieje w API, a
    # automatyzacja z ZEROWĄ liczbą uruchomień po prostu nie pojawia się
    # w statystykach, więc nie da się jej wyliczyć — nie ma listy automatyzacji
    # do porównania (O1, O12).
    #
    # Zamiast tego pytamy o coś, co API oddaje wprost i co jest MOCNIEJSZYM
    # znaleziskiem: automatyzacja, która się odpala i kończy błędem albo
    # wyczerpaniem limitu. `account_triggers_statistics_by_entity_id` zwraca
    # liczby per `automation_id` w rozbiciu na success / failure / exhausted,
    # a przy błędach także ich POWODY. Zmierzone na CXLABS: 7 automatyzacji
    # z błędami, 1056 udanych uruchomień na 1063.
    #
    # „Zbudowana i cicho psuje się od miesięcy" bije „skonfigurowana i nigdy
    # nie odpalona", bo dotyczy procesu, na który ktoś liczy.
    sygnal: |
      failure > 0 OR exhausted > 0
      OR (failure / (failure + success)) > 0.05
    rola_agenta: |
      Rozstrzygnij, czy to psuje proces, czy tylko hałasuje. Powody błędów
      są w snapshocie — przeczytaj je, zanim cokolwiek napiszesz.
      NIE twierdź, na której tablicy stoi ta automatyzacja: API nie oddaje
      przypisania automatyzacji do tablicy i tego nie zgadujemy.
      Nie twierdź też, ile automatyzacji klient ma łącznie — widzimy tylko te,
      które się uruchamiały.
    budzet_wywolan: 5
    warunki_odrzucenia:
      - pojedynczy błąd przy tysiącach udanych uruchomień — to szum, nie awaria
      - powód błędu wskazuje na dane wejściowe od człowieka, nie na konfigurację
      - exhausted przy jednorazowej migracji — limit wyczerpany świadomie
    waga: srednia
    wysilek_naprawy: niski
    typ_wyceny: ryzyko
    wzor: null
    # BEZ `board_id` i BEZ `is_active` — API nie oddaje ani jednego, ani
    # drugiego. Zamiast nich powody błędów, które są konkretniejsze.
    dowod: [automation_id, failure, success, exhausted, powody_bledow]
    widocznosc: klient
    trop_sprzedazowy: audyt automatyzacji — wejście do warsztatu

  # ═══ AI ════════════════════════════════════════════════════

  - id: AI_UNUSED
    nazwa: Konto nie wykorzystuje funkcji AI
    modul_zrodlowy: 6
    status: do_weryfikacji
    # BLOKER: nie jest potwierdzone, czy API zwraca zużycie kredytów AI.
    # Ta klasa jest nieaktywna do rozstrzygnięcia discovery.
    # Nie raportuj i nie wliczaj do kolejności, dopóki status != aktywna.
    sygnal: zuzycie_kredytow_ai = 0 AND plan_tier wspiera AI
    rola_agenta: |
      Wskaż tablice, na których kolumna AI dałaby natychmiastową wartość
      (streszczanie długich opisów, klasyfikacja zgłoszeń, ekstrakcja
      z treści). Wybieraj tablice o dużym napływie, nie największe.
    budzet_wywolan: 6
    warunki_odrzucenia:
      - plan nie obejmuje AI
      - klient świadomie wyłączył AI (polityka bezpieczeństwa)
    waga: srednia
    wysilek_naprawy: niski
    typ_wyceny: ryzyko
    wzor: null
    dowod: [zuzycie_kredytow_ai, plan_tier, "kandydaci[]"]
    widocznosc: klient
    trop_sprzedazowy: wdrożenie AI w monday — wasza główna linia rozwojowa

# ──────────────────────────────────────────────────────────────
# DO ROZSTRZYGNIĘCIA EMPIRYCZNIE
# ──────────────────────────────────────────────────────────────

otwarte_zalozenia:
  - klasa: BOARD_OVERCOMPLEX
    pytanie: |
      Ile itemów trzeba pobrać na próbkę, żeby wiarygodnie ocenić
      wypełnienie kolumny? Jeśli okaże się, że >50, ta klasa
      podnosi koszt runu i trzeba ją przemyśleć.

  - klasa: AUTOMATION_DEAD
    pytanie: |
      Czy API zwraca liczbę uruchomień automatyzacji, czy tylko
      is_active? Jeśli tylko is_active, sygnał zwęża się do
      "nieaktywna" i traci połowę wartości.

  - klasa: AI_UNUSED
    pytanie: Czy account { usage { ai } } zwraca cokolwiek.

  - klasa: wszystkie
    pytanie: |
      Czy items_count wystarcza jako proxy objętości, czy potrzebny
      jest napływ (nowe itemy / miesiąc). Napływ wymagałby zejścia
      na poziom itemów — decyzja do przemyślenia, gdyby okazał się
      niezbędny dla więcej niż jednej klasy.
